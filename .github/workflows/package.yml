name: Package

on:
  workflow_dispatch:
    inputs:
      # 手动派发时默认只构建；发布到 Release 需要显式打开。
      # A dispatched run only builds by default; publishing to a Release is opt-in.
      publish_release:
        description: "Publish the build to a GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Tag for the Release (defaults to nightly-<version>-<date>)"
        type: string
        required: false
      # 正文由调用方（AI 或人）按 docs/release-notes-template.md 写好后传入。
      # The body is supplied by the caller (AI or human) following
      # docs/release-notes-template.md.
      release_notes:
        description: "Release body in Markdown (see docs/release-notes-template.md)"
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # 补丁变更后换缓存键，避免复用未打补丁的依赖产物
          key: ${{ hashFiles('scripts/prepare_gpui.py', 'vendor/patches/*.patch') }}
          cache-on-failure: true
      - name: Build and bundle
        run: python3 scripts/package.py
      - name: Zip app bundle
        run: |
          cd target/bundle
          ditto -c -k --sequesterRsrc --keepParent "NetEase Music.app" "netease-music-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: netease-music-macos-arm64
          path: target/bundle/netease-music-macos-arm64.zip

  # Intel 芯片的 Mac 已经没有托管 runner，从 arm64 交叉编译，脚本内完成
  macos-x64:
    name: macOS x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('scripts/prepare_gpui.py', 'vendor/patches/*.patch') }}
          cache-on-failure: true
      - name: Build and bundle
        run: python3 scripts/package.py --target x86_64-apple-darwin
      - name: Zip app bundle
        run: |
          cd target/bundle
          ditto -c -k --sequesterRsrc --keepParent "NetEase Music.app" "netease-music-macos-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: netease-music-macos-x64
          path: target/bundle/netease-music-macos-x64.zip

  windows-x64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('scripts/prepare_gpui.py', 'vendor/patches/*.patch') }}
          cache-on-failure: true
      # 脚本自己产出免安装 ZIP 和 sha256 校验文件，运行时库也放在 EXE 旁边
      - name: Build and bundle
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: netease-music-gpui-windows-x64
          path: |
            target/bundle/*.zip
            target/bundle/*.sha256

  # 22.04 的 glibc 更老，产物能在更多发行版上运行；apt 包名也与 24.04 的 t64 过渡无关
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libudev-dev libvulkan-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('scripts/prepare_gpui.py', 'vendor/patches/*.patch') }}
          cache-on-failure: true
      - name: Build and bundle
        run: python3 scripts/package.py
      # tar 而不是 zip：保留可执行位
      - name: Tar bundle
        run: tar -czf netease-music-gpui-linux-x64.tar.gz -C target/bundle netease-music-gpui
      - uses: actions/upload-artifact@v4
        with:
          name: netease-music-gpui-linux-x64
          path: netease-music-gpui-linux-x64.tar.gz

  release:
    # tag push 时发正式版；手动派发且勾选了 publish_release 时发 nightly。
    # Formal release on a tag push; a nightly one when dispatched with publish_release.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    needs: [macos-arm64, macos-x64, windows-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Decide release tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
            tag="nightly-${version}-$(date -u +%Y%m%d)"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # 正文来自 dispatch 输入；为空时退回 GitHub 自动生成的提交摘要。
          # The body comes from the dispatch input; empty means fall back to
          # GitHub's auto-generated commit summary.
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_NOTES" > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$TAG" dist/* \
              --title "网易云音乐 GPUI $TAG" \
              --notes-file release-notes.md \
              --target "${{ github.sha }}"
          else
            gh release create "$TAG" dist/* \
              --title "网易云音乐 GPUI $TAG" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
